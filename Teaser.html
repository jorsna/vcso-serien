<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCSO Championship 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
#bg  { z-index: 0; }
#fx  { z-index: 2; pointer-events: none; }

.ui { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* CORNER BRACKETS */
.corner { position: fixed; width: 32px; height: 32px; z-index: 20; }
.corner::before, .corner::after { content: ''; position: absolute; background: rgba(255,215,0,.6); }
.corner::before { width: 100%; height: 2px; top: 0; left: 0; }
.corner::after  { width: 2px; height: 100%; top: 0; left: 0; }
.corner.tl { top: 20px; left: 20px; }
.corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
.corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
.corner.br { bottom: 20px; right: 20px; transform: scale(-1); }
.corner { opacity: 0; animation: popIn .3s ease forwards; }
.corner.tl { animation-delay: 2.8s; }
.corner.tr { animation-delay: 2.9s; }
.corner.bl { animation-delay: 3.0s; }
.corner.br { animation-delay: 3.1s; }

/* SCANLINES */
.scanlines {
  position: fixed; inset: 0; z-index: 15; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px);
}

/* TOP/BOTTOM BARS */
.bar-top, .bar-bottom {
  position: fixed; left: 0; right: 0; height: 3px; z-index: 20;
  opacity: 0; animation: fadeIn .4s ease forwards;
}
.bar-top    { top: 0;    animation-delay: 3.2s; background: linear-gradient(90deg, transparent 0%, #E8001A 20%, #FFD700 50%, #E8001A 80%, transparent 100%); }
.bar-bottom { bottom: 0; animation-delay: 3.3s; background: linear-gradient(90deg, transparent 0%, #C9960C 30%, #FFD700 50%, #C9960C 70%, transparent 100%); }

/* FLASH OVERLAY */
.flash { position: fixed; inset: 0; z-index: 50; background: #fff; opacity: 0; pointer-events: none; }

/* LOGO BADGE */
.badge-wrap {
  opacity: 0; transform: scale(0.4) rotate(-20deg);
  animation: badgePop .6s cubic-bezier(.17,.67,.35,1.4) 1.2s forwards;
  margin-bottom: 20px;
}
.badge {
  width: 80px; height: 80px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #1e3a6e, #07101e);
  border: 2.5px solid #C9960C;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: 0 0 0 0 rgba(255,215,0,.4), 0 0 60px rgba(255,215,0,.2);
  animation: badgePulse 2s ease 2s infinite;
}
@keyframes badgePop {
  to { opacity: 1; transform: scale(1) rotate(0deg); }
}
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,.4), 0 0 40px rgba(255,215,0,.15); }
  50%      { box-shadow: 0 0 0 16px rgba(255,215,0,.0), 0 0 60px rgba(255,215,0,.3); }
}

/* VCSO TITLE - letter by letter */
.title-row { display: flex; align-items: baseline; gap: 4px; }
.letter {
  font-family: 'Anton', sans-serif;
  font-size: clamp(72px, 16vw, 140px);
  line-height: 1;
  letter-spacing: 4px;
  color: transparent;
  background: linear-gradient(160deg, #fff 0%, #FFD700 45%, #fff 55%, #FFD700 100%);
  background-size: 300% auto;
  -webkit-background-clip: text; background-clip: text;
  opacity: 0; transform: translateY(-60px) skewX(-8deg);
  animation: letterDrop .5s cubic-bezier(.17,.67,.35,1.3) forwards, shine 3s linear 2s infinite;
}
.letter:nth-child(1) { animation-delay: .0s, 2s; }
.letter:nth-child(2) { animation-delay: .1s, 2s; }
.letter:nth-child(3) { animation-delay: .2s, 2s; }
.letter:nth-child(4) { animation-delay: .3s, 2s; }
@keyframes letterDrop {
  to { opacity: 1; transform: translateY(0) skewX(0); }
}
@keyframes shine { to { background-position: 300% center; } }

/* CHAMPIONSHIP */
.championship {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(22px, 5vw, 46px);
  letter-spacing: 14px;
  color: #C9960C;
  opacity: 0; transform: scaleX(0.3);
  transform-origin: center;
  animation: stretchIn .7s cubic-bezier(.16,1,.3,1) .6s forwards;
  margin-top: -6px;
  text-shadow: 0 0 30px rgba(201,150,12,.4);
}
@keyframes stretchIn { to { opacity: 1; transform: scaleX(1); } }

/* GOLD LINE */
.gold-line {
  width: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #FFD700, transparent);
  margin: 18px 0;
  animation: lineGrow .8s ease 1.0s forwards;
}
@keyframes lineGrow { to { width: min(300px, 75vw); } }

/* SUBTITLE */
.subtitle {
  font-size: clamp(11px, 2vw, 15px);
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  opacity: 0;
  animation: fadeUp .5s ease 1.1s forwards;
}

/* DATE SECTION */
.date-wrap {
  margin-top: 32px;
  text-align: center;
  opacity: 0;
  animation: fadeUp .6s ease 1.4s forwards;
}
.starts-label {
  font-size: 11px; letter-spacing: 7px; text-transform: uppercase;
  color: #C9960C; font-weight: 700; margin-bottom: 6px;
  animation: flicker 4s ease 3s infinite;
}
@keyframes flicker {
  0%,95%,100% { opacity: 1; }
  96% { opacity: .3; }
  97% { opacity: 1; }
  98% { opacity: .5; }
}
.date-main {
  font-family: 'Anton', sans-serif;
  font-size: clamp(32px, 7vw, 64px);
  letter-spacing: 3px;
  color: #F0F4FF;
  text-shadow: 0 0 40px rgba(255,215,0,.25), 0 2px 0 rgba(0,0,0,.5);
  animation: dateGlow 2s ease 2s infinite alternate;
}
@keyframes dateGlow {
  from { text-shadow: 0 0 30px rgba(255,215,0,.2); }
  to   { text-shadow: 0 0 60px rgba(255,215,0,.45), 0 0 100px rgba(255,215,0,.1); }
}
.date-sub {
  font-size: 12px; letter-spacing: 5px; color: rgba(255,255,255,.3);
  text-transform: uppercase; margin-top: 4px;
}

/* THIN LINE */
.thin-line {
  width: 0; height: 1px;
  background: rgba(255,255,255,.08);
  margin: 24px 0;
  animation: lineGrow .6s ease 1.6s forwards;
}

/* TEAMS */
.teams {
  display: flex; gap: clamp(16px, 4vw, 40px); align-items: center;
  opacity: 0; animation: fadeUp .5s ease 1.8s forwards;
}
.team { text-align: center; }
.team-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 3.5vw, 28px);
  letter-spacing: 4px;
  text-shadow: 0 0 20px currentColor;
}
.team-bar {
  height: 2px; width: 0; margin: 6px auto 0; border-radius: 1px;
  transition: width .4s;
}
.team.active .team-bar { width: 100%; }
.team-ryen    .team-name { color: #3b82f6; }
.team-ryen    .team-bar  { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; width: 100%; }
.team-fornebu .team-name { color: #10b981; }
.team-fornebu .team-bar  { background: #10b981; box-shadow: 0 0 8px #10b981; width: 100%; }
.team-lstr    .team-name { color: #f59e0b; }
.team-lstr    .team-bar  { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; width: 100%; }
.sep { font-family: 'Anton', sans-serif; font-size: 18px; color: rgba(255,215,0,.2); }

/* TAGLINE */
.tagline {
  position: fixed; bottom: 28px; left: 0; right: 0;
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(16px, 3vw, 24px);
  letter-spacing: 8px;
  color: rgba(255,255,255,.15);
  opacity: 0; animation: fadeIn .6s ease 3.4s forwards;
  z-index: 10;
}

/* COUNTDOWN TICKER (top) */
.ticker {
  position: fixed; top: 14px; right: 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 3px;
  color: rgba(255,215,0,.4);
  opacity: 0; animation: fadeIn .4s ease 3.5s forwards;
  z-index: 20;
}

/* HELPERS */
@keyframes popIn  { to { opacity: 1; } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div class="scanlines"></div>
<div class="bar-top"></div>
<div class="bar-bottom"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="flash" id="flash"></div>

<div class="ticker" id="ticker">VCSO · MAI & JUNI 2026</div>

<div class="ui">
  <div class="badge-wrap"><div class="badge">⚽</div></div>

  <div class="title-row">
    <span class="letter">V</span>
    <span class="letter">C</span>
    <span class="letter">S</span>
    <span class="letter">O</span>
  </div>
  <div class="championship">Championship</div>

  <div class="gold-line"></div>
  <div class="subtitle">Volvo Car Stor Oslo &nbsp;·&nbsp; Season 2026</div>

  <div class="date-wrap">
    <div class="starts-label">Starter</div>
    <div class="date-main">Mandag 4. mai</div>
    <div class="date-sub">Mai &amp; Juni 2026</div>
  </div>

  <div class="thin-line"></div>

  <div class="teams">
    <div class="team team-ryen">
      <div class="team-name">Ryen</div>
      <div class="team-bar"></div>
    </div>
    <div class="sep">◆</div>
    <div class="team team-fornebu">
      <div class="team-name">Fornebu</div>
      <div class="team-bar"></div>
    </div>
    <div class="sep">◆</div>
    <div class="team team-lstr">
      <div class="team-name">Lillestrøm</div>
      <div class="team-bar"></div>
    </div>
  </div>
</div>

<div class="tagline">La kampen om lagerbilene begynne</div>

<script>
// ── BACKGROUND CANVAS ────────────────────────────────────────────────
const bg  = document.getElementById('bg');
const bgc = bg.getContext('2d');
const fx  = document.getElementById('fx');
const fxc = fx.getContext('2d');

let W, H;
function resize() {
  W = bg.width = fx.width = window.innerWidth;
  H = bg.height = fx.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Particles
const particles = Array.from({length: 160}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx: (Math.random() - .5) * .4,
  vy: (Math.random() - .5) * .4,
  r: Math.random() * 1.8 + .2,
  a: Math.random() * .35 + .05,
  col: Math.random() > .65 ? '#FFD700' : Math.random() > .5 ? '#3b82f6' : '#fff'
}));

// Shooting stars
const stars = [];
function spawnStar() {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H * .5,
    len: Math.random() * 120 + 60,
    speed: Math.random() * 8 + 6,
    angle: Math.PI / 4 + (Math.random() - .5) * .3,
    life: 1,
    decay: Math.random() * .02 + .015
  });
}
setInterval(spawnStar, 900);

// Energy lines
const energyLines = Array.from({length: 6}, (_, i) => ({
  x: (i / 5) * window.innerWidth,
  phase: Math.random() * Math.PI * 2,
  speed: .003 + Math.random() * .003,
  amp: 20 + Math.random() * 40,
  col: i % 2 === 0 ? 'rgba(255,215,0,' : 'rgba(255,255,255,'
}));

// Flash on load
setTimeout(() => {
  const flash = document.getElementById('flash');
  flash.style.transition = 'opacity .08s';
  flash.style.opacity = '0.9';
  setTimeout(() => { flash.style.transition = 'opacity .4s'; flash.style.opacity = '0'; }, 80);
}, 800);

// Second flash
setTimeout(() => {
  const flash = document.getElementById('flash');
  flash.style.transition = 'opacity .05s';
  flash.style.opacity = '0.6';
  setTimeout(() => { flash.style.transition = 'opacity .3s'; flash.style.opacity = '0'; }, 50);
}, 1150);

let t = 0;
function draw() {
  t += .012;

  // BG
  bgc.fillStyle = '#07101E';
  bgc.fillRect(0, 0, W, H);

  // Grid
  bgc.strokeStyle = 'rgba(255,255,255,0.025)';
  bgc.lineWidth = 1;
  const gs = 80;
  for (let x = 0; x < W; x += gs) {
    bgc.beginPath(); bgc.moveTo(x, 0); bgc.lineTo(x, H); bgc.stroke();
  }
  for (let y = 0; y < H; y += gs) {
    bgc.beginPath(); bgc.moveTo(0, y); bgc.lineTo(W, y); bgc.stroke();
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    bgc.beginPath();
    bgc.arc(p.x, p.y, p.r, 0, Math.PI*2);
    bgc.fillStyle = p.col;
    bgc.globalAlpha = p.a;
    bgc.fill();
  }
  bgc.globalAlpha = 1;

  // Center radial glow
  const grd = bgc.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*.65);
  grd.addColorStop(0,  'rgba(20, 40, 80, 0.0)');
  grd.addColorStop(.5, 'rgba(7, 16, 30, 0.4)');
  grd.addColorStop(1,  'rgba(3, 8, 15, 0.92)');
  bgc.fillStyle = grd;
  bgc.fillRect(0, 0, W, H);

  // FX canvas
  fxc.clearRect(0, 0, W, H);

  // Energy lines (horizontal waves near top/bottom)
  for (const el of energyLines) {
    el.phase += el.speed;
    fxc.beginPath();
    for (let x = 0; x < W; x += 2) {
      const y = (H * .12) + Math.sin(x * .015 + el.phase) * el.amp;
      x === 0 ? fxc.moveTo(x, y) : fxc.lineTo(x, y);
    }
    fxc.strokeStyle = el.col + '0.04)';
    fxc.lineWidth = 1;
    fxc.stroke();
    fxc.beginPath();
    for (let x = 0; x < W; x += 2) {
      const y = (H * .88) + Math.sin(x * .015 + el.phase + Math.PI) * el.amp;
      x === 0 ? fxc.moveTo(x, y) : fxc.lineTo(x, y);
    }
    fxc.strokeStyle = el.col + '0.04)';
    fxc.stroke();
  }

  // Shooting stars
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    const ex = s.x + Math.cos(s.angle) * s.len;
    const ey = s.y + Math.sin(s.angle) * s.len;
    const grad = fxc.createLinearGradient(s.x, s.y, ex, ey);
    grad.addColorStop(0, `rgba(255,215,0,0)`);
    grad.addColorStop(1, `rgba(255,215,0,${s.life * .8})`);
    fxc.beginPath();
    fxc.moveTo(s.x, s.y); fxc.lineTo(ex, ey);
    fxc.strokeStyle = grad;
    fxc.lineWidth = 1.5;
    fxc.stroke();
    s.x += Math.cos(s.angle) * s.speed;
    s.y += Math.sin(s.angle) * s.speed;
    s.life -= s.decay;
    if (s.life <= 0 || s.x > W || s.y > H) stars.splice(i, 1);
  }

  // Gold pulse rings from center
  const rings = [0, .6, 1.2];
  for (const offset of rings) {
    const phase = ((t * .3) + offset) % 1;
    const radius = phase * Math.min(W, H) * .55;
    const alpha = (1 - phase) * .12;
    fxc.beginPath();
    fxc.arc(W/2, H/2, radius, 0, Math.PI*2);
    fxc.strokeStyle = `rgba(255,215,0,${alpha})`;
    fxc.lineWidth = 1.5;
    fxc.stroke();
  }

  requestAnimationFrame(draw);
}
draw();

// Ticker updates
const msgs = [
  'VCSO · MAI & JUNI 2026',
  '3 POENG PER SALG',
  'RYEN · FORNEBU · LILLESTRØM',
  'STARTER MANDAG 4. MAI',
  'LA KAMPEN BEGYNNE',
];
let mi = 0;
const ticker = document.getElementById('ticker');
setInterval(() => {
  ticker.style.transition = 'opacity .3s';
  ticker.style.opacity = '0';
  setTimeout(() => {
    mi = (mi + 1) % msgs.length;
    ticker.textContent = msgs[mi];
    ticker.style.opacity = '';
  }, 300);
}, 2800);
</script>
</body>
</html>
