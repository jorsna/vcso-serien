name: Auto-Gazzetta

on:
  schedule:
    # 04:15 UTC = 06:15 norsk sommertid, alle dager.
    # GitHub kan forsinke planlagte kjøringer noe; start tidlig.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generer på nytt selv om dagens utgave finnes'
        type: boolean
        default: false

# Hindrer at to kjøringer (Supabase-trigger + GitHub-schedule) går samtidig.
# Den andre venter, ser at utgaven finnes, og hopper over.
concurrency:
  group: auto-gazzetta
  cancel-in-progress: false

jobs:
  gazzetta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # én feilende konkurranse stopper ikke de andre
      matrix:
        konkurranse: [champ, selekt, osat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.47.0
      - run: python -m playwright install --with-deps chromium
      - name: Generer Gazzetta (${{ matrix.konkurranse }})
        env:
          SISTE_DATO: '2026-10-01'   # siste utgave dekker 30. september
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python scripts/auto_gazzetta.py ${{ matrix.konkurranse }}
