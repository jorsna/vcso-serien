* { box-sizing:border-box; margin:0; padding:0; }

:root {
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --gold3: #f7e098;

html, body { background: var(--ink); min-height:100vh; }

/* ── Particles canvas ── */
#particles-canvas {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.55;
}

/* ── Noise grain overlay ── */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  opacity: 0.5; mix-blend-mode: overlay;
}

/* ── Diagonal gold rule ── */
.page-wrap {
  position:relative; z-index:2; max-width: 520px; margin:0 auto; padding: 0 0 60px;

/* ── Keyframes ── */
@keyframes float    { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
@keyframes pulse-gold { 0%,100%{opacity:.7} 50%{opacity:1} }
@keyframes shimmer  {
  0%  { background-position: -200% center; }
  100%{ background-position:  200% center; }
}
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes reveal-up {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes reveal-fade {
  from { opacity:0; } to { opacity:1; }
}
@keyframes crown-drop {
  0%   { opacity:0; transform:translateY(-40px) scale(0.7) rotate(-10deg); }
  60%  { transform:translateY(6px) scale(1.08) rotate(2deg); }
  80%  { transform:translateY(-4px) scale(0.97) rotate(-1deg); }
  100% { opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
}
@keyframes line-grow {
  from { transform:scaleX(0); } to { transform:scaleX(1); }
}
@keyframes bar-fill {
  from { width:0%; } to { width:var(--bar-w); }
}
@keyframes orbit {
  from { transform:rotate(0deg) translateX(var(--r)) rotate(0deg); }
  to   { transform:rotate(360deg) translateX(var(--r)) rotate(-360deg); }
}
@keyframes glow-pulse {
  0%,100% { box-shadow: 0 0 20px var(--gold-glow), 0 0 60px rgba(201,168,76,0.1); }

@keyframes number-pop {

  70% { transform:scale(1.15); }

}
@keyframes scan-line {
  0%  { transform:translateY(-100%); }
  100%{ transform:translateY(400%); }
}
@keyframes dash {
  to { stroke-dashoffset: 0; }

<script>
/* Gold particle field */
(function(){
  const c = document.getElementById('particles-canvas');
  const ctx = c.getContext('2d');
  let W,H,pts=[];
  function resize(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);
  for(let i=0;i<55;i++){
    pts.push({
      x:Math.random()*9999, y:Math.random()*9999,
      vx:(Math.random()-.5)*0.18, vy:(Math.random()-.5)*0.18,
      r:Math.random()*1.4+0.3, a:Math.random()
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      const pulse = 0.4+0.6*Math.abs(Math.sin(Date.now()*0.0007+p.a*6.28));
      ctx.beginPath();
      ctx.arc(p.x%W,p.y%H,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(201,168,76,${pulse*0.45})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

/* ── All logic below identical to original ── */
function isoWeek(d) {
  const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = u.getUTCDay() || 7;
  u.setUTCDate(u.getUTCDate() + 4 - day);
  const y1 = new Date(Date.UTC(u.getUTCFullYear(), 0, 1));
  return Math.ceil((((u - y1) / 86400000) + 1) / 7);
}
function weekDates(year, week) {
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const w1s  = new Date(jan4);
  w1s.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1));
  const s = new Date(w1s); s.setUTCDate(w1s.getUTCDate() + (week-1)*7);
  const e = new Date(s);   e.setUTCDate(s.getUTCDate() + 6); e.setUTCHours(23,59,59,999);
  return { start:s, end:e };
}
function getLastWeek() {
  const now  = new Date();
  const thisWeek = isoWeek(now);
  const thisYear = now.getFullYear();
  if (thisWeek > 1) {
    return { year: thisYear, week: thisWeek - 1 };
  } else {
    // Uke 1 → forrige uke er siste uke i fjoråret
    const dec28 = new Date(Date.UTC(thisYear - 1, 11, 28));
    return { year: thisYear - 1, week: isoWeek(dec28) };
  }
}
function rankSales(sales) {
  const m = {};
  sales.forEach(s => {
    if (!m[s.selger]) m[s.selger] = { salg:0, finansiert:0, loc:s.loc, firstTs: s.ts };
    m[s.selger].salg++;
    if (s.finansiert) m[s.selger].finansiert++;
    if (s.ts < m[s.selger].firstTs) m[s.selger].firstTs = s.ts;
  });
  return Object.entries(m)
    .map(([name,d]) => ({ name,...d, poeng:d.salg*3 }))
    .sort((a,b) => b.poeng-a.poeng || b.finansiert-a.finansiert || a.firstTs.localeCompare(b.firstTs));
}
function getWeekWinners(ranked) {

function getBestDept(ws) {
  const deptSales = {};
  ws.forEach(s => { const loc=s.loc||''; if(!loc)return; deptSales[loc]=(deptSales[loc]||0)+1; });
  if (!Object.keys(deptSales).length) return null;
  const max = Math.max(...Object.values(deptSales));
  const best = Object.keys(deptSales).filter(k=>deptSales[k]===max);
  return { locs: best, count: max };
}
function getMVPs(ws) {
  const bd = {};
  ws.forEach(s => {
    const day=s.ts.slice(0,10);
    if(!bd[day])bd[day]={};
    bd[day][s.selger]=(bd[day][s.selger]||0)+1;
  });
  const days = Object.keys(bd).sort();
  const mc = {};
  days.forEach(day=>{
    const ds=bd[day], max=Math.max(...Object.values(ds));
    Object.entries(ds).forEach(([n,c])=>{ if(c===max)mc[n]=(mc[n]||0)+1; });
  });
  if(!Object.keys(mc).length) return [];
  const sorted=Object.entries(mc).sort((a,b)=>b[1]-a[1]);
  const topCount=sorted[0][1];
  return sorted
    .filter(([,count])=>count===topCount)

      return {name,count,loc:ws.find(s=>s.selger===name)?.loc||"",days,mvpDays};
    });
}

    <div style={{ position:"relative", width:ringSize, height:ringSize, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div className="lux-avatar-ring2" style={{ width:ringSize, height:ringSize, position:"absolute", top:0, left:0 }} />
      <div className="lux-avatar-ring"  style={{ width:size+8, height:size+8, position:"absolute", top:(ringSize-size-8)/2, left:(ringSize-size-8)/2 }} />
      <div className="lux-avatar" style={{ width:size, height:size }}>
        {photo
          ? <img src={photo} alt={name} />
          : <div style={{ width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:DEPT[loc]?.bg||"rgba(201,168,76,0.12)",fontFamily:"'Cormorant Garamond',serif",fontSize:size*.35,fontWeight:600,color:dc(loc) }}>{init}</div>
        }
      </div>
    </div>
  );
}

function LuxCard({ children, accentColor, className="", style={} }) {
  const accent = accentColor || "#c9a84c";
  return (
    <div className={`lux-card reveal ${className}`} style={style}>
      <div className="lux-card-accent" style={{ background:`linear-gradient(90deg,transparent,${accent},transparent)` }} />
      {children}
    </div>
  );
}

function CardLabel({ children }) {
  return <div className="card-label">{children}</div>;
}

function TrebleBanner({ name }) {
  return (
    <div className="treble-banner reveal">
      <div className="spark-orbit" style={{ animationDelay:"0s",   background:"#c9a84c" }} />
      <div className="spark-orbit" style={{ animationDelay:"1.7s", background:"#4a8fff", "--r":"140px" }} />
      <div className="spark-orbit" style={{ animationDelay:"3.3s", background:"#27c98a", "--r":"100px" }} />
      <div className="treble-crown">👑</div>
      <div className="treble-sub gold-text">Historisk prestasjon · The Treble</div>
      <div className="treble-name gold-text">{name}</div>
      <div className="treble-caption">Ukens vinner &nbsp;·&nbsp; Flest MVP-dager &nbsp;·&nbsp; Beste avdeling</div>
    </div>
  );
}

function WinnerCard({ winners, ranked, weekSales }) {
  const isTied = winners.length > 1;
  const w0 = winners[0];
  const color = dc(w0.loc);
  return (
    <LuxCard accentColor={color} className="winner-card" style={{ marginTop:20 }}>
      <CardLabel>{isTied ? "⚖ Delt ukens vinner" : "✦ Ukens vinner"}</CardLabel>
      {winners.map((w, i) => (
        <div key={w.name}>
          {i > 0 && <div style={{ borderTop:"1px solid rgba(201,168,76,0.1)", margin:"28px 0" }} />}
          <div style={{ display:"flex", alignItems:"center", gap:20, marginBottom:8 }}>
            <Avatar name={w.name} loc={w.loc} size={72} />
            <div style={{ flex:1 }}>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"clamp(28px,7vw,52px)", fontWeight:300, letterSpacing:"0.04em", lineHeight:1, color:"var(--text)", marginBottom:6 }}>
                {w.name}
              </div>
              <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:9, fontWeight:700, letterSpacing:"0.26em", textTransform:"uppercase", color:dc(w.loc) }}>
                {dl(w.loc)}
              </div>
            </div>
          </div>
          <div className="stat-trio">
            {[
              { v: w.salg,       l: "Salg",       delay:"0.1s" },
              { v: w.poeng,      l: "Poeng",       delay:"0.2s" },
              { v: w.finansiert, l: "Finansiert",  delay:"0.3s" },
            ].map(({v,l,delay}) => (
              <div className="stat-box" key={l}>
                <div className="stat-num gold-text" style={{ animationDelay:delay }}>{v}</div>
                <div className="stat-label">{l}</div>
              </div>
            ))}
          </div>
        </div>
      ))}

      {ranked.length > winners.length && (
        <div style={{ marginTop:28 }}>
          <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:8, fontWeight:600, letterSpacing:"0.22em", textTransform:"uppercase", color:"var(--text-faint)", marginBottom:14 }}>
            Øvrig topp {Math.min(ranked.length, 5)}
          </div>
          {ranked.slice(winners.length, 5).map((r, i) => (
            <div className="rank-row" key={r.name} style={{ animationDelay:`${(i+1)*0.08}s` }}>
              <div className="rank-pos">{i + winners.length + 1}</div>
              <div style={{ width:36, height:36, flexShrink:0, borderRadius:"50%", overflow:"hidden", border:`1px solid ${dc(r.loc)}44`, background:DEPT[r.loc]?.bg||"rgba(201,168,76,0.08)", display:"flex", alignItems:"center", justifyContent:"center" }}>
                {SELGER_PHOTOS[nameToId(r.name)]
                  ? <img src={SELGER_PHOTOS[nameToId(r.name)]} style={{ width:"100%", height:"100%", objectFit:"cover", filter:"grayscale(80%)" }} />
                  : <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:13, fontWeight:600, color:dc(r.loc) }}>{r.name.split(" ").map(p=>p[0]).join("").slice(0,2)}</span>
                }
              </div>
              <div className="rank-name">{r.name}</div>
              <div className="rank-pts" style={{ color:dc(r.loc) }}>{r.poeng}<span style={{ fontSize:11, color:"var(--text-faint)", fontWeight:300 }}>p</span></div>
            </div>
          ))}
        </div>
      )}
    </LuxCard>
  );
}

function MVPCard({ mvps }) {
  if (!mvps.length) return null;
  const isTied = mvps.length > 1;
  return (
    <LuxCard accentColor="#c9a84c">
      <CardLabel>{isTied ? "◈ Delt flest MVP-dager" : "◈ Flest MVP-dager"}</CardLabel>
      {mvps.map((mvp, idx) => (
        <div key={mvp.name}>
          {idx > 0 && <div style={{ borderTop:"1px solid rgba(201,168,76,0.1)", margin:"24px 0" }} />}
          <div style={{ display:"flex", alignItems:"center", gap:18, marginBottom:18 }}>
            <Avatar name={mvp.name} loc={mvp.loc} size={56} />
            <div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"clamp(22px,5vw,36px)", fontWeight:300, letterSpacing:"0.04em", lineHeight:1, color:"var(--text)" }}>
                {mvp.name}
              </div>
              <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:10, fontWeight:600, color:"var(--gold)", marginTop:6, letterSpacing:"0.06em" }}>
                MVP {mvp.count} av {mvp.days.length} dag{mvp.days.length>1?"er":""}
              </div>
            </div>
          </div>
          <div style={{ display:"flex", gap:5 }}>
            {mvp.days.map((day, i) => (
              <div key={day} className="day-pip" style={{
                background: mvp.mvpDays[i] ? "rgba(201,168,76,0.12)" : "rgba(255,255,255,0.03)",
                borderColor: mvp.mvpDays[i] ? "rgba(201,168,76,0.45)" : "rgba(255,255,255,0.06)",
              }}>
                <div className="day-pip-label" style={{ color: mvp.mvpDays[i] ? "var(--gold)" : "rgba(255,255,255,0.18)" }}>
                  {new Date(day).toLocaleDateString("no-NO",{weekday:"short"}).toUpperCase().slice(0,2)}
                </div>
                {mvp.mvpDays[i] && <div style={{ fontSize:13, marginTop:4 }}>◆</div>}
              </div>
            ))}
          </div>
        </div>
      ))}
    </LuxCard>
  );
}

function HatTrickCard({ hatters, weekSales }) {
  if (!hatters.length) return null;
  return (
    <LuxCard accentColor="#27c98a">
      <CardLabel>⬡ Hat-trick denne uken</CardLabel>
      {hatters.map((h, idx) => {
        const days = {};
        weekSales.filter(s=>s.selger===h.name).forEach(s=>{
          const d=s.ts.slice(0,10); days[d]=(days[d]||0)+1;
        });
        const htDays = Object.entries(days).filter(([,c])=>c>=3).map(([d,c])=>({d,c}));
        return (
          <div key={h.name}>
            {idx > 0 && <div style={{ borderTop:"1px solid rgba(39,201,138,0.1)", margin:"24px 0" }} />}
            <div style={{ display:"flex", alignItems:"center", gap:18, marginBottom:16 }}>
              <Avatar name={h.name} loc={h.loc} size={52} />
              <div>
                <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"clamp(20px,5vw,34px)", fontWeight:300, letterSpacing:"0.04em", lineHeight:1, color:"var(--text)" }}>
                  {h.name}
                </div>
                <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:9, fontWeight:600, color:"#27c98a", marginTop:6, letterSpacing:"0.08em", textTransform:"uppercase" }}>
                  {htDays.length} hat-trick-dag{htDays.length>1?"er":""}
                </div>
              </div>
            </div>
            {htDays.map(({d,c}) => (
              <div key={d} className="ht-day">
                <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, fontWeight:600, color:"#27c98a", flexShrink:0 }}>{c}</div>
                <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:9, color:"var(--text-faint)", fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase" }}>salg</div>
                <div style={{ width:1, height:14, background:"rgba(39,201,138,0.25)", flexShrink:0 }} />
                <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:11, color:"rgba(255,255,255,0.55)" }}>
                  {new Date(d).toLocaleDateString("no-NO",{weekday:"long",day:"numeric",month:"long"})}
                </div>
              </div>
            ))}
          </div>
        );
      })}
    </LuxCard>
  );
}

function DeptCard({ result }) {
  if (!result) return null;
  return (
    <LuxCard accentColor="rgba(255,255,255,0.2)">
      <CardLabel>◉ Beste forhandler denne uken</CardLabel>
      {result.locs.map((loc, i) => (
        <div key={loc} style={{ display:"flex", alignItems:"center", gap:18, marginBottom: i < result.locs.length-1 ? 16 : 0 }}>
          <div style={{ width:60, height:60, borderRadius:3, background:DEPT[loc]?.bg||"rgba(201,168,76,0.1)", border:`1px solid ${dc(loc)}44`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:13, fontWeight:600, letterSpacing:"0.1em", color:dc(loc) }}>
              {(DEPT[loc]?.label||loc).slice(0,3).toUpperCase()}
            </span>
          </div>
          <div>
            <div className="dept-badge" style={{ color:dc(loc) }}>{DEPT[loc]?.label||loc}</div>
            <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:10, color:"var(--text-faint)", marginTop:3, letterSpacing:"0.06em" }}>
              {result.count} salg denne uken
            </div>
          </div>
        </div>
      ))}
    </LuxCard>
  );
}

function App() {
  const [sales, setSales] = useState(null);
  const [error, setError] = useState(null);
  const lw = getLastWeek();

  useEffect(() => {
    const { start, end } = weekDates(lw.year, lw.week);
    const from = start.toISOString();
    const to   = end.toISOString();
    fetch(`${SB_URL}/rest/v1/sales?select=*&ts=gte.${from}&ts=lte.${to}&deleted=is.false&order=ts.asc`, {
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
    })
      .then(r => r.ok ? r.json() : Promise.reject(r.statusText))
      .then(setSales)
      .catch(e => setError(String(e)));
  }, []);

  if (error) return (
    <div className="error-state">Feil: {error}</div>
  );
  if (!sales) return (
    <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center" }}>
      <div className="spin" />
    </div>
  );

  const ranked   = rankSales(sales);
  const winners  = getWeekWinners(ranked);
  const mvps     = getMVPs(sales);
  const bestDept = getBestDept(sales);

  const htMap = {};
  sales.forEach(s => {
    const d = s.ts.slice(0,10);
    if (!htMap[s.selger]) htMap[s.selger] = {};
    htMap[s.selger][d] = (htMap[s.selger][d]||0)+1;
  });
  const hatters = Object.entries(htMap)
    .filter(([,days]) => Object.values(days).some(c=>c>=3))
    .map(([name]) => ({ name, loc: sales.find(s=>s.selger===name)?.loc||"" }));

  const mvpNames      = new Set(mvps.map(m=>m.name));
  const trebleWinners = winners.filter(w => mvpNames.has(w.name) && bestDept?.locs.includes(w.loc));
  const hasTreble     = trebleWinners.length > 0;

  const { start, end } = weekDates(lw.year, lw.week);

  return (
    <div style={{ fontFamily:"'Montserrat',sans-serif", color:"var(--text)", background:"var(--ink)", minHeight:"100vh" }}>

      {/* Header */}
      <header className="site-header">
        <div className="ornament ornament-tl" />
        <div className="ornament ornament-tr" />
        <div className="ornament ornament-bl" />
        <div className="ornament ornament-br" />
        <div className="header-eyebrow">VCSO Championship 2026</div>
        <div className="header-title">Ukens<br/>Vinner</div>
        <div className="header-week gold-text">Uke {lw.week}</div>
        <div className="header-date">{fmt(start)} — {fmt(end)}</div>
        {!sales.length && (
          <div style={{ marginTop:24, fontFamily:"'Cormorant Garamond',serif", fontSize:16, color:"var(--text-faint)", fontStyle:"italic" }}>
            Ingen salg registrert denne uken.
          </div>
        )}
      </header>

      {sales.length > 0 && (
        <div className="page-wrap">
          {hasTreble && <TrebleBanner name={trebleWinners[0].name} />}

          {winners.length > 0 && <WinnerCard winners={winners} ranked={ranked} weekSales={sales} />}

          {mvps.length > 0 && (
            <>
              <div className="section-divider">Daglig MVP</div>
              <MVPCard mvps={mvps} />
            </>
          )}

          {hatters.length > 0 && (
            <>
              <div className="section-divider">Hat-trick</div>
              <HatTrickCard hatters={hatters} weekSales={sales} />
            </>
          )}

          {bestDept && (
            <>
              <div className="section-divider">Avdelingstoppen</div>
              <DeptCard result={bestDept} />
            </>
          )}

          {/* Alle salg */}
          <div className="section-divider">Alle {sales.length} salg</div>
          <div style={{ margin:"0 16px" }}>
            {sales.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).map((s,i) => (
              <div key={i} className="sale-row">
                <div style={{ width:5,height:5,borderRadius:"50%",background:dc(s.loc),flexShrink:0,boxShadow:`0 0 6px ${dc(s.loc)}88` }} />
                <div style={{ flex:1, fontFamily:"'Montserrat',sans-serif", fontSize:13, color:"rgba(240,232,216,0.72)", fontWeight:500 }}>{s.selger}</div>
                <div style={{ fontSize:11, color:"var(--text-faint)", letterSpacing:"0.04em" }}>{s.modell}</div>
                {s.finansiert && (
                  <div style={{ fontFamily:"'Montserrat',sans-serif", fontSize:7, fontWeight:700, color:"var(--gold)", letterSpacing:"0.16em", padding:"2px 6px", border:"1px solid rgba(201,168,76,0.3)", borderRadius:2 }}>FIN</div>
                )}
                <div style={{ fontSize:10, color:"var(--text-faint)", letterSpacing:"0.06em", flexShrink:0 }}>
                  {s.ts.slice(5,10).replace("-",".")}
                </div>
              </div>
            ))}
          </div>

          {/* Footer ornament */}
          <div style={{ textAlign:"center", padding:"48px 24px 0", opacity:0.25 }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:11, letterSpacing:"0.4em", color:"var(--gold)", textTransform:"uppercase" }}>
              — VCSO —
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
